      (() => {
        const disableAppIcon = () => {
          const ico = document.querySelector('[data-app-favicon-ico]')
          const png = document.querySelector('[data-app-favicon-png]')
          if (ico) ico.href = '/favicon_disabled.ico'
          if (png) png.href = '/favicon_disabled_32.png'
        }
        window.addEventListener('campustu:app-error', disableAppIcon)
        window.addEventListener('error', disableAppIcon, true)
        window.addEventListener('unhandledrejection', disableAppIcon)
      })()
